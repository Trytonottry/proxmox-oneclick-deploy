name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Build panel image
        run: docker build -t panel-skeleton:ci -f roles/billing/files/Dockerfile roles/billing/files/
      - name: Run unit tests
        run: echo "No tests defined yet"
  deploy-image:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository }}/panel-skeleton:latest -f roles/billing/files/Dockerfile roles/billing/files/
          docker push ghcr.io/${{ github.repository }}/panel-skeleton:latest
